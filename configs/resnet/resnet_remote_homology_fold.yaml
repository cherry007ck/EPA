model:
  type: resnet
  architecture: ProteinResNet
  parameters:
    embed_dim: 128
    channels:
    - 64
    - 128
    - 256
    - 512
    num_blocks:
    - 2
    - 2
    - 2
    - 2
    dropout: 0.3
training:
  epochs: 30
  batch_size: 16
  learning_rate: 0.001
  optimizer: adam
  weight_decay: 0.0001
  gradient_clip: 1.0
  patience: 10
  min_delta: 0.0001
augmentation:
  strategy: online
  all_augmentations: true
dataset:
  name: remote_homology_fold
  task_type: classification
  num_classes: 1195
  metric: accuracy
  secondary_metric: mcc
compute:
  device: cuda
  num_workers: 4
  pin_memory: true
  mixed_precision: true
output:
  save_model: true
  save_best_only: true
  log_interval: 100
